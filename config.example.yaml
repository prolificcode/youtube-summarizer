# YouTube Summarizer Configuration (YAML format)
#
# NOTE: YAML configuration support is planned for future versions.
# Currently, the application uses environment variables and .env files.
# This file serves as documentation and a template for future YAML support.
#
# To use configuration now, please use .env file or environment variables
# with the YTS_ prefix (see .env.example for details).

# ============================================================================
# Ollama Configuration
# ============================================================================
ollama:
  # URL of the Ollama API server
  host: http://localhost:11434

  # Default model to use for summarization
  # Popular options: llama3.1:8b, llama3.1:70b, mistral, mixtral
  default_model: llama3.1:8b

  # Timeout for API requests in seconds
  timeout: 300

# ============================================================================
# Database Configuration
# ============================================================================
database:
  # Path to SQLite database file (relative or absolute)
  path: ./data/summaries.db

# ============================================================================
# Summarization Settings
# ============================================================================
summarization:
  # Maximum tokens to generate for summaries (50-4096)
  # Higher values = longer, more detailed summaries
  max_length: 500

  # Temperature parameter for LLM generation (0.0-2.0)
  # Lower values = more focused and deterministic
  # Higher values = more creative and varied
  temperature: 0.7

# ============================================================================
# Transcript Settings
# ============================================================================
transcript:
  # Preferred languages for transcripts (ISO 639-1 codes)
  # The tool will try to fetch transcripts in these languages in order
  preferred_languages:
    - en

  # Example: Multi-language support
  # preferred_languages:
  #   - en  # English
  #   - es  # Spanish
  #   - fr  # French
  #   - de  # German

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO

  # Path to log file (null to disable file logging)
  file: ./data/app.log

# ============================================================================
# CLI Output Configuration
# ============================================================================
output:
  # Output format: rich (colored, formatted) or plain (simple text)
  format: rich


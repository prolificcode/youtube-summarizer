# ============================================================================
# Notes
# ============================================================================
#
# 1. Environment Variables vs YAML:
#    - YAML config support is planned for future versions
#    - Currently, use .env file or environment variables (YTS_* prefix)
#    - Environment variables always take precedence over file config
#
# 2. Model Selection:
#    - llama3.1:8b - Fast, good for most use cases (default)
#    - llama3.1:70b - Slower but higher quality summaries
#    - mistral - Fast alternative to Llama
#    - mixtral - High-quality alternative
#
# 3. Temperature Guide:
#    - 0.0-0.3: Very focused, deterministic (good for factual summaries)
#    - 0.4-0.7: Balanced (recommended for general use)
#    - 0.8-1.0: Creative, varied (good for diverse perspectives)
#    - 1.1-2.0: Very creative (may be less accurate)
#
# 4. Max Length Guide:
#    - 100-300: Quick bullet points
#    - 300-600: Standard paragraph summary
#    - 600-1000: Detailed summary
#    - 1000+: Comprehensive analysis
#
# 5. Language Codes (ISO 639-1):
#    - en: English
#    - es: Spanish
#    - fr: French
#    - de: German
#    - ja: Japanese
#    - ko: Korean
#    - zh: Chinese
#    - pt: Portuguese
#    - ru: Russian
#    - ar: Arabic
#    - See: https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes
